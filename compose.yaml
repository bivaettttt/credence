name: credence
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credence
      POSTGRES_PASSWORD: credence-local-db
      POSTGRES_DB: credence
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U credence"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://credence:credence-local-db@db/credence
      DEMO_PASSWORD: ${CREDENCE_DEMO_PASSWORD:-Credence-demo-local}
      LAB_MODE: ${CREDENCE_LAB_MODE:-0}
    command: ["/bin/sh", "-ec", "alembic upgrade head && python -m credence.seed && exec uvicorn credence.api:app --host 0.0.0.0"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${CREDENCE_PORT:-8110}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
